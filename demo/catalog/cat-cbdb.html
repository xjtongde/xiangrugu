<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBDB 人物库 · pg32b 数据总目</title>
<style>
:root{--bg:#0e1116;--panel:#161b23;--panel2:#1c232e;--ink:#e8e6df;--dim:#8b94a3;--gold:#d4a24e;--jade:#6fb3a0;--red:#c56a5a;--blue:#5b8db8;--line:#2a3342;--violet:#9b7fb8;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif;line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 80px}
/* ---------- sticky topbar ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(14,17,22,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top a.home{color:var(--gold);text-decoration:none;font-size:14px;letter-spacing:2px;white-space:nowrap}
.top b{font-size:16px;letter-spacing:2px;white-space:nowrap}
.top .chips{color:var(--dim);font-size:12px;white-space:nowrap}
.grow{flex:1}
input#q{background:#0b0e13;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 12px 7px 32px;font-family:inherit;font-size:13px;width:280px;outline:none;transition:border-color .15s;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="%238b94a3" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>');background-repeat:no-repeat;background-position:10px center}
input#q:focus{border-color:var(--gold)}
kbd{background:#232c3a;border:1px solid var(--line);border-radius:4px;font-size:10px;padding:0 4px;color:var(--dim);margin-left:6px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 12px;font-family:inherit;font-size:12.5px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--gold)}
/* ---------- hero ---------- */
.hero{padding:34px 0 6px}
h1{font-size:30px;letter-spacing:4px;font-weight:600}
h1 em{font-style:normal;color:var(--gold)}
.sub{color:var(--dim);font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),var(--jade))}
.stat b{display:block;font-size:29px;color:var(--jade);font-family:Georgia,serif;font-weight:600;letter-spacing:.5px}
.stat span{font-size:12.5px;color:var(--dim)}
.charts{display:grid;grid-template-columns:7fr 5fr;gap:14px;margin-bottom:8px}
@media(max-width:980px){.charts{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h3{font-size:14px;color:var(--gold);letter-spacing:2px;font-weight:600;margin-bottom:4px}
.card .note{font-size:12px;color:var(--dim);margin-bottom:8px}
/* ---------- treemap / donut ---------- */
.tm rect{cursor:pointer;transition:opacity .12s}
.tm rect:hover{opacity:1!important;stroke:var(--gold);stroke-width:1.5}
.donut path{cursor:pointer;transition:opacity .15s}
.legendrow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);padding:2.5px 4px;border-radius:6px;cursor:pointer;transition:background .12s}
.legendrow:hover{background:#1d2531;color:var(--ink)}
.legendrow.off{opacity:.35}
.legendrow i{width:10px;height:10px;border-radius:3px;flex:none}
.legendrow .n{flex:1}
.legendrow b{font-family:Georgia,serif;color:var(--ink);font-weight:600}
/* ---------- type bar ---------- */
.tbar{display:flex;height:26px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.tbar div{transition:flex .3s}
.typekey{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dim)}
.typekey i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
/* ---------- fam chips ---------- */
.famrow{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.famchip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 13px;font-size:12.5px;color:var(--dim);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.famchip i{width:8px;height:8px;border-radius:50%}
.famchip:hover{color:var(--ink);border-color:var(--gold)}
.famchip.on{color:#111;background:var(--gold);border-color:var(--gold)}
.famchip.on i{background:#111!important}
/* ---------- table cards ---------- */
.count{color:var(--dim);font-size:12.5px;margin:10px 2px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0;opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease,border-color .15s}
.tcard.in{opacity:1;transform:none}
.tcard:hover{border-color:#3a4658}
.thead{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;user-select:none}
.fdot{width:9px;height:9px;border-radius:50%;flex:none}
.tname{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;color:var(--ink);white-space:nowrap}
.lv{font-size:10.5px;border-radius:4px;padding:0 5px;flex:none;letter-spacing:.5px}
.lv.ok{background:#1d3a33;color:var(--jade);border:1px solid #2c554a}
.lv.doc{background:#33301f;color:var(--gold);border:1px solid #55502f}
.lv.guess{background:#3a2622;color:var(--red);border:1px solid #5a3a33}
.tdesc{font-size:12.5px;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnum{font-family:Georgia,serif;font-size:15px;color:var(--jade);white-space:nowrap}
.mini{font-size:11px;color:var(--dim);background:#232c3a;border-radius:5px;padding:1px 7px;white-space:nowrap}
.mini.g{color:var(--blue)}
.chev{color:var(--dim);transition:transform .25s;flex:none;font-size:12px}
.tcard.open .chev{transform:rotate(90deg)}
.tbody{max-height:0;overflow:hidden;transition:max-height .35s ease}
.tcard.open .tbody{max-height:none;overflow:visible}
.tbin{padding:4px 18px 18px;border-top:1px dashed #222a37}
/* ---------- column profile ---------- */
table.prof{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
table.prof th{color:var(--dim);text-align:left;font-weight:500;border-bottom:1px solid var(--line);padding:5px 8px;font-size:12px;white-space:nowrap}
table.prof td{border-bottom:1px dashed #222a37;padding:4.5px 8px;vertical-align:middle}
table.prof tr:hover td{background:#1d2531}
.cn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--blue);white-space:nowrap}
.dt{font-size:10.5px;color:var(--dim);background:#232c3a;border-radius:4px;padding:0 6px;white-space:nowrap}
.mbar{display:inline-block;width:64px;height:6px;background:#0b0e13;border-radius:3px;overflow:hidden;vertical-align:1px;margin-left:6px}
.mbar i{display:block;height:100%}
.mbar.j i{background:var(--jade)}.mbar.g i{background:var(--gold)}
.mv{display:inline-block;background:#232c3a;border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:11.5px;color:var(--ink);margin:1px 3px 1px 0;white-space:nowrap}
.mv b{color:var(--jade);font-family:Georgia,serif;font-weight:600}
.rng{font-family:Georgia,serif;font-size:12px;color:var(--dim)}
.samp{font-size:11.5px;color:var(--dim);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
.relchip{display:inline-block;background:#1d2a3a;border:1px solid #2c4055;border-radius:6px;padding:1px 9px;font-size:11.5px;color:var(--blue);margin:2px 4px 2px 0;font-family:ui-monospace,Menlo,monospace}
.secnote{font-size:12px;color:var(--dim);margin:14px 0 2px}
.sampwrap{overflow-x:auto;margin-top:6px;border:1px solid var(--line);border-radius:8px}
table.samp{border-collapse:collapse;font-size:11.5px;white-space:nowrap}
table.samp th{background:#1c232e;color:var(--dim);font-weight:500;padding:4px 9px;border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:11px;position:sticky;top:0}
table.samp td{padding:3.5px 9px;border-bottom:1px dashed #222a37;color:var(--ink);max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.samp tr:last-child td{border-bottom:none}
.empty{color:var(--dim);font-size:12.5px;padding:10px 0}
/* ---------- misc ---------- */
#tip{position:fixed;display:none;background:#0b0e13;border:1px solid var(--gold);color:var(--ink);font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;z-index:99;max-width:360px;line-height:1.55}
#tip b{color:var(--gold)}
footer{margin-top:50px;border-top:1px solid var(--line);padding-top:14px;color:var(--dim);font-size:12px}
a{color:var(--gold)}
.nohit{color:var(--dim);font-size:13px;padding:30px;text-align:center}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;color:var(--blue)}
</style>
</head>

function treemap(items,x,y,w,h,out){
  if(!items.length||w<1||h<1)return;
  if(items.length===1){out.push({it:items[0],x,y,w,h});return;}
  const total=items.reduce((s,i)=>s+i.v,0)||1;
  let acc=0,best=1,bd=1e18;
  for(let i=0;i<items.length-1;i++){acc+=items[i].v;const d=Math.abs(acc/total-.5);if(d<bd){bd=d;best=i+1;}}
  const L=items.slice(0,best),R=items.slice(best);
  const lt=(L.reduce((s,i)=>s+i.v,0)/total)||0;
  if(w>=h){treemap(L,x,y,Math.max(1,w*lt),h,out);treemap(R,x+w*lt,y,w-w*lt,h,out);}
  else{treemap(L,x,y,w,Math.max(1,h*lt),out);treemap(R,x,y+h*lt,w,h-h*lt,out);}
}

  if(on){
    if(card.dataset.built!=='1'){const t=BY_TB[card.id.slice(5)];b.innerHTML=bodyHTML(t);card.dataset.built='1';}
    card.classList.add('open');b.style.maxHeight=b.scrollHeight+'px';
    setTimeout(()=>{if(card.classList.contains('open'))b.style.maxHeight='none';},380);
  }else{
    if(!card.classList.contains('open'))return;
    b.style.maxHeight=b.scrollHeight+'px';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{card.classList.remove('open');b.style.maxHeight='0px';}));
  }
}
const BY_TB={};DATA.tables.forEach(t=>BY_TB[t.tb]=t);
let io=null;
if(typeof IntersectionObserver!=='undefined')
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{rootMargin:'100px'});
function render(){
  const q=($('q').value||'').trim().toLowerCase();
  let rows=DATA.tables.filter(t=>(!activeFam||t.fam===activeFam)&&(!q||(t.tb+' '+t.desc+' '+t.cols.map(c=>c.n).join(' ')).toLowerCase().includes(q)));
  rows.sort(SORTS[sortMode][1]);
  $('count').textContent=`显示 ${rows.length} / ${DATA.tables.length} 表 · 合计 ${fmt(rows.reduce((s,t)=>s+t.rows,0))} 行`+(q?` · 搜索「${q}」`:'')+(activeFam?` · 家族「${activeFam}」`:'');
  $('list').innerHTML=rows.length?rows.map(cardHTML).join(''):'<div class="nohit">无匹配。试试列名（如 x_coord / c_personid）或中文说明。</div>';
  const cards=[...$('list').querySelectorAll('.tcard')];
  cards.forEach(c=>{c.querySelector('.thead').addEventListener('click',()=>setOpen(c,!c.classList.contains('open')));
    if(io)io.observe(c);else c.classList.add('in');});
}
render();
let deb=null;
$('q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(render,140);});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus();}
  if(e.key==='Escape'){$('q').value='';render();}
});
$('sortbtn').addEventListener('click',()=>{sortMode=(sortMode+1)%SORTS.length;$('sortbtn').textContent='排序：'+SORTS[sortMode][0];render();});
let allOpen=false;
$('expbtn').addEventListener('click',()=>{
  allOpen=!allOpen;$('expbtn').textContent=allOpen?'全部收起':'全部展开';
  document.querySelectorAll('#list .tcard').forEach(c=>setOpen(c,allOpen));
});
