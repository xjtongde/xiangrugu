# roots.yaml —— 数据源根、换算规则与目标库（唯一机器可读权威）
#
# 定位：datamgmt/ 模块一切代码读取源件路径与连接目标，**只许读本文件**（纪律 2：禁止硬编码绝对路径，P-17）。
# 人读摘要＝ docs/holdings.md（已持有资料与许可）。原 docs/data-sources.md 已于 2026-09-30 依用户令删除；
# 两者冲突时以本文件为准，并须同批改 docs/holdings.md（R-04/R-06）。
#
# 数字纪律（P-20）：每个数字都带 as_of 与口径；`measured_by: this-session` 者系 2026-09-29（模块开设批）／2026-09-30（文档清理批）两批实测，逐处以该处 as_of 为准，
# `measured_by: books` 者系账面值（出处已注），**用前须复测**。

version: 1
established: "2026-09-29"
authority: |
  用户令（原话照录）：「1，要导入数据源的在这个目录下：/mnt/wd61workmetadata/usedata」
  配套标尺令：「源数据的错误与对，不是我们来判断的。我们的依据就是源数据。……
  我们的核心工作就是无错的把源数据，导入到pg32b数据库。」（→ rules.md R-07）

# ─────────────────────────────────────────────────────────────
# 一、根（两个：权威在用区 ＋ 只读下载区）
# ─────────────────────────────────────────────────────────────
roots:

  usedata:                              # ★导入唯一取材处（用户令 1）
    path: /mnt/wd61workmetadata/usedata
    host: 192.168.3.32
    role: authoritative-source          # 权威数据源目录（2026-09-28 用户令设立）
    usage_policy: "2026-10-02 用户令：usedata 只含【本项目使用】件——使用件保留并记用途，不使用件清出（不判断源数据对错，仅按项目是否使用取舍）。"
    access: read-only                   # 源件内容决不可改（R-07）；整件清出须经用户令并留痕
    as_of: "2026-10-06"
    measured_by: this-session
    inventory:                          # 2026-10-06 SSH 只读复核：189 个普通文件，根可读
      total_files: 189
      subtrees:
        - name: chgis-v6
          files: 1
          content: "China_Periods_ReignDates.zip（155,774 B）"
        - name: harvard
          files: 15
          content: "首批装数工作集：cbdb/（sqlite3＋json）、chgis/（v6 三件 utf_wgs84＋EULA＋README＋data_dictionary＋SHA256SUMS.txt＋VERIFICATION.md）、tab/（三小件 .tab）、SHA256SUMS、README.md"
        - name: harvard-full
          files: 171
          content: "第二批全量：doi_10_7910/DVN/<DOI>/ 逐档案原件（含 zip 套 zip）；2026-10-02 已清出旧版 CBDB_20240208_sqlite.db（PAGGQS 空目录随之删）"
      top_files:
        - "README-b2.md（48,851 B，二批说明）"
        - "SHA256SUMS-b2（172 行，二批校验账，2026-10-02 清出旧版后重写）"

  download:                             # 下载区：从网下载之原件，只读、只作回溯与增补来源
    path: /mnt/wd61workmetadata/xiangrugudata
    host: 192.168.3.32
    role: read-only-original
    access: read-only
    as_of: "2026-09-28"
    measured_by: books                  # 账面值，出处＝原 docs/data-sources.md §八（已删，git show 75ecd77:docs/data-sources.md）；2026-09-30 已 ls 复核树数＝7 相符；用前须复测
    inventory:
      trees: 7
      total_files: 16803
      total_bytes: 20868871885
    note: "数据流向＝下载区 →copy→ 在用区 usedata/ → 导入 pg32b。**拷入而非搬移**（守'下载源决不能修改'纪律）。"

# ─────────────────────────────────────────────────────────────
# 二、完整性校验账（三份，路径基准各不同——用错基准即全盘报缺）
# ─────────────────────────────────────────────────────────────
checksums:
  - file: /mnt/wd61workmetadata/usedata/SHA256SUMS-b2
    lines: 172
    as_of: "2026-10-02"
    measured_by: this-session
    path_base: usedata                  # ★行内路径相对于 usedata/（实测首行：chgis-v6/…）
    covers: 二批（chgis-v6 ＋ harvard-full，清出旧版 CBDB 后 172 件）
    removal_note: "2026-10-02 用户令清出 harvard-full/DOI/PAGGQS/CBDB_20240208_sqlite.db（旧版），本账重写为 172 行。"
    last_verification:
      result: "172/172 相符（2026-10-02 清出旧版后闸0 复验；harvard 账 13/13；发布方账 5/6，唯一 missing 系其列错路径）"
      as_of: "2026-10-02"
      measured_by: this-session
      source: datamgmt/recon/gate0_integrity.json
  - file: /mnt/wd61workmetadata/usedata/harvard/SHA256SUMS
    lines: 13
    as_of: "2026-09-29"
    measured_by: this-session
    path_base: harvard                  # 待阶段一闸0 核实
    covers: 首批
  - file: /mnt/wd61workmetadata/usedata/harvard/chgis/SHA256SUMS.txt
    lines: 6
    as_of: "2026-09-29"
    measured_by: this-session
    path_base: chgis                    # 发布方自带；覆盖范围待阶段一闸0 核实
    covers: CHGIS v6 发布件
    note: "发布方自带校验账（非我方生成）——闸0 须同时对我方账与发布方账，两者皆过才算完整。"

# ─────────────────────────────────────────────────────────────
# 三、路径换算（双根共键：一份台账，两个根都能落地）
# ─────────────────────────────────────────────────────────────
path_resolution:
  ledger: /root/xiangrugu/datamgmt/recon/inventory_members.tsv  # 7,219 成员（rel/name/carrier/size；2026-10-05 新鲜枚举，取代已删旧 src_paths.tsv）
  ledger_as_of: "2026-10-05"
  ledger_measured_by: recon
  rules:
    - "usedata 内绝对路径 ＝ /mnt/wd61workmetadata/usedata ＋ inventory_members.tsv 之 rel"
    - "下载区绝对路径 　＝ /mnt/wd61workmetadata/xiangrugudata ＋ 同一 rel"
    - "rel 指向外层 zip 时，内层成员链逐层展开（zip 套 zip；全链见 ledger_final.tsv 之 source 列）"
  code_rule: |
    代码内**只存相对键**（rel 成员链），根一律从本文件 roots.* 取。
    成员枚举**禁止**用锚定单后缀正则（如 \.zip$）——须用 (\.zip)+$ 并加 re.I（P-11，实测命中 30 件、过度匹配 0 件）。
  migration_note: "旧装载台账 src_paths.tsv 已 2026-10-05 用户令删除（旧方案退役）；路径账以 recon/inventory_members.tsv 新鲜枚举为准，阶段二据此收敛进 config/sources.yaml。"

# ─────────────────────────────────────────────────────────────
# 四、路径政策（P-17：路径腐化三层，实测 2026-09-29）
# ─────────────────────────────────────────────────────────────
path_policy:
  - path: /mnt/wd61workmetadata/usedata/
    status: only-legal-source-root      # ★唯一合法源根
    note: "旧 23 支脚本中 **0 处**指向此根——即无一支脚本读权威源。本模块一律以此为准。"
  - path: /mnt/nas-mirror/
    status: forbidden                   # 项目读写皆禁
    since: "2026-09-27"
    note: "旧 23 支脚本中 **15 处**仍硬编码此根；该路径实测**仍存在**，故误用不会报错、只会静默读到禁用区——最危险的一类腐化。"
  - path: /mnt/wd61workmetadata/harvard-full/
    status: gone                        # 已不存在
    since: "2026-09-28（七棵下载树整体搬入 xiangrugudata/）"
    note: "旧脚本 **3 处**硬编码此根，照原样重跑即 FileNotFoundError（实测）。"
  - path: /tmp/
    status: forbidden-as-workledger     # 禁止作为工作账落点
    note: "旧脚本工作目录 /tmp/pg32b-load2 实测**已不存在**，recon 台账靠事后抢救（P-12）。工作账唯一落点＝datamgmt/recon/。"

# ─────────────────────────────────────────────────────────────
# 五、目标库
# ─────────────────────────────────────────────────────────────
target:
  instance: pg32b
  host: 192.168.3.32
  port: 5433                            # 5432 系 pg32 生产口，不动
  database: xiangrugu                   # 计划新建的正式目标；创建数据库须另获用户授权
  sample_database: xiangrugu_sample
  rehearsal_database: xiangrugu_rehearsal
  container: pg32b
  user: postgres
  image: "pg32b-full:18-pgdg（＝36 之 pg36-full:18-pgdg 同字节拷贝；PG 18.6＋PostGIS 3.6.4＋pgvector 0.8.6）"
  planned_extensions: "建库前按导入合同核实；至少需要 PostGIS，栅格载体若入库则需要 postgis_raster。不得从现有 cbdb 推断目标库已配置。"
  verified_as_of: "2026-10-06"
  state: "pg32b 容器运行中；xiangrugu 尚不存在。"
  legacy_databases:
    - name: cbdb
      authority: none
      policy: "仅可观察；不得作为来源、基线或验收依据。最终删除须另获用户明确同意。"
    - name: cbdb_reh
      authority: none
      policy: "旧彩排库，不是本方案目标或基线；后续处置待用户明确指令。"
  access_pattern: 'ssh 192.168.3.32 "docker exec -i pg32b psql -U postgres -d xiangrugu -At -F''|''" <<SQL … SQL'
  sql_quoting_rule: "SQL 内字符串一律单引号；-At -F'|' 之外不要再套双引号（PG 中双引号＝标识符定界符，会报 column does not exist）。"
  co_tenancy_warning: "pg32b 与生产 pg32 **同在 32 主机**（另有 n8n/chainlit/graphrag 等在跑）→ 一切装载须 nice -n 19 ionice -c3 ＋ loadavg<4.0 门禁（30s 轮询）＋ canary 计时。"
